  <title>Pocket Arcade</title>
  <script>
    // Tablets (iPads): lay the app out at phone size and let the browser scale it up to fill the screen,
    // rather than showing small games in the middle of a big screen.
    (function () {
      function fit() {
        var a = screen.width, b = screen.height, small = Math.min(a, b), big = Math.max(a, b);
        if (small < 700) return;                                   // phones: as they are
        var k = small / 540;                                       // ~1.5× on an iPad
        var landscape = window.matchMedia('(orientation: landscape)').matches;
        var w = Math.round((landscape ? big : small) / k);
        document.querySelector('meta[name=viewport]').setAttribute('content', 'width=' + w + ', user-scalable=no, viewport-fit=cover');
      }
      fit();
      window.addEventListener('orientationchange', function () { setTimeout(fit, 200); });
    })();
  </script>
